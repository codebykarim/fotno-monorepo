services:
  # ──────────────────────────────────────────────
  # Backend Services
  # ──────────────────────────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_PROFESSIONAL=${STRIPE_PRICE_PROFESSIONAL}
      - STRIPE_PRICE_BUSINESS=${STRIPE_PRICE_BUSINESS}
      - STRIPE_PRICE_UNLIMITED=${STRIPE_PRICE_UNLIMITED}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL}
      - NEXT_PUBLIC_GALLERY_URL=${NEXT_PUBLIC_GALLERY_URL}
      - NEXT_PUBLIC_LANDING_URL=${NEXT_PUBLIC_LANDING_URL}
      - UPLOAD_SERVICE_URL=${UPLOAD_SERVICE_URL}
      - PHOTO_WORKER_IN_API=${PHOTO_WORKER_IN_API}
      - GOOGLE_OAUTH_CALLBACK_URL=${GOOGLE_OAUTH_CALLBACK_URL}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND}
      - SENTRY_ENVIRONMENT=production
    expose:
      - "8000"

  upload-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    environment:
      - NODE_ENV=production
      - UPLOAD_SERVICE_PORT=4001
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CHUNK_SIZE_BYTES=${CHUNK_SIZE_BYTES}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES}
      - MAX_FILES_PER_BATCH=${MAX_FILES_PER_BATCH}
      - PRESIGNED_URL_TTL_SEC=${PRESIGNED_URL_TTL_SEC}
      - UPLOAD_SESSION_TTL_HRS=${UPLOAD_SESSION_TTL_HRS}
      - PROCESSOR_CONCURRENCY=${PROCESSOR_CONCURRENCY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    expose:
      - "4001"

  image-processor:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/image-processor/Dockerfile
    environment:
      - NODE_ENV=production
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - IMAGE_PROCESSOR_BATCH_SIZE=${IMAGE_PROCESSOR_BATCH_SIZE}
      - IMAGE_PROCESSOR_POLL_MS=${IMAGE_PROCESSOR_POLL_MS}
      - IMAGE_PROCESSOR_RETRY_FAILED=${IMAGE_PROCESSOR_RETRY_FAILED}
      - IMAGE_PROCESSOR_STALE_MS=${IMAGE_PROCESSOR_STALE_MS}
    healthcheck:
      disable: true

  # ──────────────────────────────────────────────
  # Frontend Apps (Next.js)
  # ──────────────────────────────────────────────
  landing:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
        NEXT_PUBLIC_RYBBIT_HOST: ${NEXT_PUBLIC_RYBBIT_HOST}
        NEXT_PUBLIC_RYBBIT_SITE_ID: ${NEXT_PUBLIC_RYBBIT_SITE_ID}
        NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID: ${NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3000"

  dashboard:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_SENTRY_DSN_DASHBOARD: ${NEXT_PUBLIC_SENTRY_DSN_DASHBOARD}
        BACKEND_API_URL: ${BACKEND_API_URL}
        NEXT_PUBLIC_RYBBIT_HOST: ${NEXT_PUBLIC_RYBBIT_HOST}
        NEXT_PUBLIC_RYBBIT_SITE_ID: ${NEXT_PUBLIC_RYBBIT_SITE_ID}
        NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID: ${NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
      - SENTRY_DSN_DASHBOARD=${SENTRY_DSN_DASHBOARD}
      - SENTRY_ENVIRONMENT=production
    expose:
      - "3001"

  auth:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
        NEXT_PUBLIC_RYBBIT_HOST: ${NEXT_PUBLIC_RYBBIT_HOST}
        NEXT_PUBLIC_RYBBIT_SITE_ID: ${NEXT_PUBLIC_RYBBIT_SITE_ID}
        NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID: ${NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3002"

  gallery:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/gallery/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_SENTRY_DSN_GALLERY: ${NEXT_PUBLIC_SENTRY_DSN_GALLERY}
        BACKEND_API_URL: ${BACKEND_API_URL}
        NEXT_PUBLIC_RYBBIT_HOST: ${NEXT_PUBLIC_RYBBIT_HOST}
        NEXT_PUBLIC_RYBBIT_SITE_ID: ${NEXT_PUBLIC_RYBBIT_SITE_ID}
        NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID: ${NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
      - GALLERY_SESSION_SECRET=${GALLERY_SESSION_SECRET}
      - SENTRY_DSN_GALLERY=${SENTRY_DSN_GALLERY}
      - SENTRY_ENVIRONMENT=production
    expose:
      - "3003"

  admin:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
        NEXT_PUBLIC_RYBBIT_HOST: ${NEXT_PUBLIC_RYBBIT_HOST}
        NEXT_PUBLIC_RYBBIT_SITE_ID: ${NEXT_PUBLIC_RYBBIT_SITE_ID}
        NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID: ${NEXT_PUBLIC_GALLERY_RYBBIT_SITE_ID}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3004"

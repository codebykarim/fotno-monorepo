services:
  # ──────────────────────────────────────────────
  # Backend Services
  # ──────────────────────────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PAYMOB_API_KEY=${PAYMOB_API_KEY}
      - PAYMOB_SECRET_KEY=${PAYMOB_SECRET_KEY}
      - PAYMOB_PUBLIC_KEY=${PAYMOB_PUBLIC_KEY}
      - PAYMOB_INTEGRATION_ID=${PAYMOB_INTEGRATION_ID}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL}
      - NEXT_PUBLIC_DASHBOARD_URL=${NEXT_PUBLIC_DASHBOARD_URL}
      - NEXT_PUBLIC_GALLERY_URL=${NEXT_PUBLIC_GALLERY_URL}
      - NEXT_PUBLIC_LANDING_URL=${NEXT_PUBLIC_LANDING_URL}
      - IMAGE_SEARCH_SERVICE_URL=${IMAGE_SEARCH_SERVICE_URL}
      - UPLOAD_SERVICE_URL=${UPLOAD_SERVICE_URL}
      - PHOTO_WORKER_IN_API=${PHOTO_WORKER_IN_API}
      - GOOGLE_OAUTH_CALLBACK_URL=${GOOGLE_OAUTH_CALLBACK_URL}
      - SENTRY_DSN_BACKEND=${SENTRY_DSN_BACKEND}
      - SENTRY_ENVIRONMENT=production
    expose:
      - "8000"

  upload-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    environment:
      - NODE_ENV=production
      - UPLOAD_SERVICE_PORT=4001
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      - CHUNK_SIZE_BYTES=${CHUNK_SIZE_BYTES}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES}
      - MAX_FILES_PER_BATCH=${MAX_FILES_PER_BATCH}
      - PRESIGNED_URL_TTL_SEC=${PRESIGNED_URL_TTL_SEC}
      - UPLOAD_SESSION_TTL_HRS=${UPLOAD_SESSION_TTL_HRS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - IMAGE_SEARCH_SERVICE_URL=${IMAGE_SEARCH_SERVICE_URL}
    expose:
      - "4001"

  image-processor:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/image-processor/Dockerfile
    environment:
      - NODE_ENV=production
      - DIRECT_URL=${DIRECT_URL}
      - DATABASE_URL=${DIRECT_URL}
      - REDIS_URL=${REDIS_URL}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      - CLOUDFRONT_KEY_PAIR_ID=${CLOUDFRONT_KEY_PAIR_ID}
      - CLOUDFRONT_PRIVATE_KEY=${CLOUDFRONT_PRIVATE_KEY}
      - IMAGE_SEARCH_SERVICE_URL=${IMAGE_SEARCH_SERVICE_URL}
      - UPLOAD_SERVICE_URL=${UPLOAD_SERVICE_URL}
      - IMAGE_PROCESSOR_BATCH_SIZE=${IMAGE_PROCESSOR_BATCH_SIZE}
      - IMAGE_PROCESSOR_POLL_MS=${IMAGE_PROCESSOR_POLL_MS}
      - IMAGE_PROCESSOR_RETRY_FAILED=${IMAGE_PROCESSOR_RETRY_FAILED}
      - IMAGE_PROCESSOR_STALE_MS=${IMAGE_PROCESSOR_STALE_MS}
      - PROCESSOR_CONCURRENCY=${PROCESSOR_CONCURRENCY}
      - CHUNK_SIZE_BYTES=${CHUNK_SIZE_BYTES}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES}
      - PRESIGNED_URL_TTL_SEC=${PRESIGNED_URL_TTL_SEC}
      - UPLOAD_SESSION_TTL_HRS=${UPLOAD_SESSION_TTL_HRS}
    healthcheck:
      disable: true

  image-search-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/image-search-service/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=4002
      - SIGLIP_SERVICE_URL=${SIGLIP_SERVICE_URL}
      - QWEN_SERVICE_URL=${QWEN_SERVICE_URL}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE}
      - EMBEDDING_WORKER_CONCURRENCY=${EMBEDDING_WORKER_CONCURRENCY}
      - CAPTIONING_BATCH_SIZE=${CAPTIONING_BATCH_SIZE}
      - CAPTIONING_ENABLED=${CAPTIONING_ENABLED}
      - CAPTIONING_WORKER_CONCURRENCY=${CAPTIONING_WORKER_CONCURRENCY}
      - CAPTION_CLUSTER_THRESHOLD=${CAPTION_CLUSTER_THRESHOLD}
      - CAPTION_LIBRARY_SIMILARITY_THRESHOLD=${CAPTION_LIBRARY_SIMILARITY_THRESHOLD}
    expose:
      - "4002"

  # ──────────────────────────────────────────────
  # AI Services
  # ──────────────────────────────────────────────
  siglip-service:
    platform: linux/amd64
    build:
      context: ./apps/siglip-service
      dockerfile: Dockerfile
    environment:
      - PORT=8001
      - MAX_BATCH_SIZE=16
    expose:
      - "8001"
    volumes:
      - huggingface-cache-siglip:/root/.cache/huggingface

  qwen-ai-service:
    platform: linux/amd64
    build:
      context: ./apps/qwen-ai-service
      dockerfile: Dockerfile
    environment:
      - QWEN_SERVICE_PORT=8002
      - MODEL_SIZE=${MODEL_SIZE}
      - MAX_BATCH_SIZE=8
    expose:
      - "8002"
    volumes:
      - huggingface-cache-qwen:/root/.cache/huggingface

  # ──────────────────────────────────────────────
  # Frontend Apps (Next.js)
  # ──────────────────────────────────────────────
  landing:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3000"

  dashboard:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_SENTRY_DSN_DASHBOARD: ${NEXT_PUBLIC_SENTRY_DSN_DASHBOARD}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
      - SENTRY_DSN_DASHBOARD=${SENTRY_DSN_DASHBOARD}
      - SENTRY_ENVIRONMENT=production
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT_DASHBOARD=${SENTRY_PROJECT_DASHBOARD}
    expose:
      - "3001"

  auth:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3002"

  gallery:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/gallery/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        NEXT_PUBLIC_SENTRY_DSN_GALLERY: ${NEXT_PUBLIC_SENTRY_DSN_GALLERY}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
      - GALLERY_SESSION_SECRET=${GALLERY_SESSION_SECRET}
      - SENTRY_DSN_GALLERY=${SENTRY_DSN_GALLERY}
      - SENTRY_ENVIRONMENT=production
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT_GALLERY=${SENTRY_PROJECT_GALLERY}
    expose:
      - "3003"

  admin:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      - NODE_ENV=production
      - BACKEND_API_URL=${BACKEND_API_URL}
    expose:
      - "3004"

volumes:
  huggingface-cache-siglip:
  huggingface-cache-qwen:

services:
  # ──────────────────────────────────────────────
  # Backend Services
  # ──────────────────────────────────────────────
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      IMAGE_SEARCH_SERVICE_URL: http://image-search-service:4002
      UPLOAD_SERVICE_URL: http://upload-service:3010
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - image-search-service

  upload-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/upload-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3010/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  image-processor:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/image-processor/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      IMAGE_SEARCH_SERVICE_URL: http://image-search-service:4002
    # Background worker — no HTTP port
    healthcheck:
      disable: true
    depends_on:
      - image-search-service

  image-search-service:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/image-search-service/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      # Override DATABASE_URL to use the pgvector database
      DATABASE_URL: ${IMAGE_SEARCH_DATABASE_URL}
      SIGLIP_SERVICE_URL: http://siglip-service:8001
      QWEN_SERVICE_URL: http://qwen-ai-service:8002
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - siglip-service
      - qwen-ai-service

  # ──────────────────────────────────────────────
  # AI Services
  # ──────────────────────────────────────────────
  siglip-service:
    platform: linux/amd64
    build:
      context: ./apps/siglip-service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: 8001
      MAX_BATCH_SIZE: 16
    ports:
      - "8001:8001"
    volumes:
      - huggingface-cache-siglip:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  qwen-ai-service:
    platform: linux/amd64
    build:
      context: ./apps/qwen-ai-service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      QWEN_SERVICE_PORT: 8002
      MODEL_SIZE: 2b
      MAX_BATCH_SIZE: 8
    ports:
      - "8002:8002"
    volumes:
      - huggingface-cache-qwen:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ──────────────────────────────────────────────
  # Frontend Apps (Next.js)
  # ──────────────────────────────────────────────
  landing:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"

  dashboard:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"

  auth:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "3002:3002"

  gallery:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/gallery/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "3003:3003"

  admin:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL}
        NEXT_PUBLIC_GALLERY_URL: ${NEXT_PUBLIC_GALLERY_URL}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL}
        BACKEND_API_URL: ${BACKEND_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "3004:3004"

volumes:
  huggingface-cache-siglip:
  huggingface-cache-qwen:
